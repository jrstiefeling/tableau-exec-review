<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="doc-title">Analytics Business Review</title>
    <!-- Inline so there is no second request and no 404 in the console. Three
         bars and a plan tick: the board's own encoding, at 16px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f5f4f0'/%3E%3Crect x='6' y='8' width='9' height='4' rx='1' fill='%23c0483c'/%3E%3Crect x='6' y='14' width='14' height='4' rx='1' fill='%2392640a'/%3E%3Crect x='6' y='20' width='19' height='4' rx='1' fill='%2312806a'/%3E%3Crect x='22' y='6' width='1.6' height='20' fill='%2317181c'/%3E%3C/svg%3E"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/SalesforceSans-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="./fonts/AvantGardeForSalesforceW05-Dm.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./styles/base.css" />
    <!-- After base.css: its :root token block re-points --font-display and
         --font-body at equal specificity, so no other stylesheet changes. -->
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tabs.css" />
    <link rel="stylesheet" href="./styles/portlets.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-id">
          <!-- The Tableau mark, hand-built from the nine plus signs the
               identity is composed of: one large, four at the cardinals, four
               at the corners. Every mark is an axis-aligned rectangle, so it
               stays crisp from the 22px the topbar draws it at up to any
               display size, with no raster asset and no second request.

               It does not take --tab-accent. A product mark is not a datum:
               the tab indicator, the topbar hairline and the kicker rule all
               carry the per-tab accent already, and a logo that changes colour
               as you move across tabs is a logo that has been mistaken for a
               reading. It does not drain in direct mode either — see the note
               on .topbar-mark in base.css. -->
          <svg
            class="topbar-mark"
            viewBox="0 0 24 24"
            role="img"
            aria-label="Tableau"
            focusable="false"
          >
            <g class="mark-corner">
              <rect x="3.05" y="4.2" width="4.2" height="1.9" />
              <rect x="4.2" y="3.05" width="1.9" height="4.2" />
              <rect x="16.75" y="4.2" width="4.2" height="1.9" />
              <rect x="17.9" y="3.05" width="1.9" height="4.2" />
              <rect x="3.05" y="17.9" width="4.2" height="1.9" />
              <rect x="4.2" y="16.75" width="1.9" height="4.2" />
              <rect x="16.75" y="17.9" width="4.2" height="1.9" />
              <rect x="17.9" y="16.75" width="1.9" height="4.2" />
            </g>
            <g class="mark-side">
              <rect x="0.15" y="10.9" width="5.5" height="2.2" />
              <rect x="1.8" y="9.25" width="2.2" height="5.5" />
              <rect x="18.35" y="10.9" width="5.5" height="2.2" />
              <rect x="20" y="9.25" width="2.2" height="5.5" />
            </g>
            <g class="mark-axis">
              <rect x="9.25" y="1.8" width="5.5" height="2.2" />
              <rect x="10.9" y="0.15" width="2.2" height="5.5" />
              <rect x="9.25" y="20" width="5.5" height="2.2" />
              <rect x="10.9" y="18.35" width="2.2" height="5.5" />
            </g>
            <g class="mark-core">
              <rect x="6.4" y="10.15" width="11.2" height="3.7" />
              <rect x="10.15" y="6.4" width="3.7" height="11.2" />
            </g>
          </svg>
          <div class="topbar-titles">
            <p class="topbar-eyebrow" id="topbar-eyebrow">Tableau MCP · Semantic Layer</p>
            <p class="topbar-name" id="topbar-name">Analytics Business Review</p>
          </div>
        </div>

        <nav class="tabnav" id="tabnav" aria-label="Review sections">
          <span class="tabnav-indicator" id="tabnav-indicator" aria-hidden="true"></span>
        </nav>

        <div class="topbar-actions">
          <!-- The state readout and the control that changes it are one
               object. They used to be a badge reading "Governed · Tableau
               semantic layer" beside a button reading "See it without the
               Knowledge Layer" — 450px to carry one bit, and the badge was
               the first thing dropped on a narrow viewport, which took the
               mode indicator off a board whose whole subject is governance.
               As a two-segment switch it is a quarter of the width and never
               has to be hidden. -->
          <span
            class="mode-switch"
            id="trust-legend"
            data-mode="governed"
            title="Governed — Tableau semantic layer"
          >
            <span class="mode-switch-state" id="trust-legend-text">Governed</span>
            <span class="trust-legend-dot" data-tier="green" aria-hidden="true"></span>
            <button
              id="layer-toggle"
              class="mode-switch-btn"
              type="button"
              aria-pressed="false"
              title="Render the same board with no semantic layer (K)"
            >
              Direct
            </button>
          </span>
        </div>
      </header>

      <div id="notice" class="notice" role="status" aria-live="polite" hidden>
        <span class="notice-text" id="notice-text"></span>
        <button id="notice-dismiss" class="notice-dismiss" type="button" aria-label="Dismiss notice">×</button>
      </div>

      <main class="stage" id="stage">
        <div class="stage-scrim" id="stage-scrim" aria-hidden="true"></div>
      </main>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
